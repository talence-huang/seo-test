[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "seo-intel"
version = "0.1.0"
description = "可觀察的自主 SEO 競爭情報研究 Agent（研究用途）"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.15",
    "httpx>=0.28",        # SimWeb 傳輸層與抓取工具；SDK 本身使用 httpx2
    "pydantic>=2.14",
    "pyyaml>=6.0",
    "typer>=0.27",
    "rich>=15.0",
]

[project.optional-dependencies]
dev = ["pytest>=9.1"]

[project.scripts]
seo-intel = "seo_intel.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
seo_intel = ["store/*.sql", "memory/*.sql", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = [
    "live: 會呼叫真實 Anthropic API、產生費用的測試（以 -m live 明確執行）",
]
