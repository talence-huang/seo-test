# s6（測試）SaaS 文件站：競品內容策略
# 真相：flowboard.sim 新上線 /compare/ 範本（60 篇甘特圖工具比較頁，含比較表）
# 干擾項：chartly.sim 同期小幅更新甘特圖文件頁
id: s6
split: test
archetype: saas_docs
seed: 606
now: 2026-10-01
goal:
  type: competitor_content_strategy
  question: 競品 flowboard.sim 在「gantt charts」主題成長很快，它的內容策略是什麼？
  own_site: own-plano.sim
  competitors: [flowboard.sim, chartly.sim]
  focus_competitor: flowboard.sim
  cluster: gantt charts
  window: [2026-06-01, 2026-10-01]
sites:
  - domain: own-plano.sim
    role: own
    archetype: saas_docs
    counts: {docs: 500, blog: 400, tag: 300}
  - domain: flowboard.sim
    role: competitor
    archetype: saas_docs
    counts: {docs: 3000, blog: 8000, tag: 6000, changelog: 1500, app: 1500}
    extra_templates:
      - name: comparisons
        kind: guide
        prefix: /compare/
        count: 60
        clusters: [gantt charts]
        words: [1200, 2000]
        schema_types: [Article]
        sections: [4, 7]
        has_table: true
        archived_rate: 0.5
        launched_by: ev-compare-launch
    flaky_rate: 0.04
    malformed_rate: 0.01
    injection: {template: comparisons}
  - domain: chartly.sim
    role: competitor
    archetype: saas_docs
    counts: {docs: 1500, blog: 1500, tag: 1000}
events:
  - id: ev-compare-launch
    site: flowboard.sim
    template: comparisons
    kind: launch
    date: 2026-07-01
    spread_days: 30
  - id: ev-docs-touch
    site: chartly.sim
    template: docs
    kind: refresh
    cluster: gantt charts
    pages: 40
    date: 2026-07-10
    spread_days: 7
    changes: {words_mult: 1.1}
effects:
  - id: fx-growth
    cause: ev-compare-launch
    cluster: gantt charts
    own_loss: 1.5
    competitor_gain: 6.0
    lag_days: 10
    ramp_days: 21
